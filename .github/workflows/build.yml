name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 libgtk-4-dev imagemagick file

      - name: Build binaries
        run: make

      - name: Build AppImage
        run: ./packaging/build-appimage.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radmin-vpn-linux-binaries
          path: |
            build/rvpnnetmp.sys
            build/adapter_hook.dll
            build/rvpn_launcher.exe
            build/netsh.exe
            build/netsh64.exe
            build/drvinst.exe
            build/tap_bridge
            build/rvpn_filter_ui
            build/rvpn_dnsfix.so
            build/rvpn_reuseport.so

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radmin-vpn-linux-appimage
          path: packaging/dist/RadminVPN-Linux-x86_64.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radmin-vpn-linux-binaries
          path: build/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radmin-vpn-linux-appimage
          path: .

      - name: Package tarball
        run: tar czf radmin-vpn-linux-${{ github.ref_name }}.tar.gz -C build .

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            radmin-vpn-linux-${{ github.ref_name }}.tar.gz
            RadminVPN-Linux-x86_64.AppImage
          generate_release_notes: true
