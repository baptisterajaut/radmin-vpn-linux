name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 libgtk-4-dev imagemagick file

      - name: Build binaries
        run: make

      - name: Build AppImage
        run: ./packaging/build-appimage.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radmin-vpn-linux-binaries
          path: |
            build/rvpnnetmp.sys
            build/adapter_hook.dll
            build/rvpn_launcher.exe
            build/netsh.exe
            build/netsh64.exe
            build/drvinst.exe
            build/tap_bridge
            build/rvpn_filter_ui
            build/rvpn_dnsfix.so
            build/rvpn_reuseport.so

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radmin-vpn-linux-appimage
          path: packaging/dist/RadminVPN-Linux-x86_64.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: radmin-vpn-linux-binaries
          path: build/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: radmin-vpn-linux-appimage
          path: .

      - name: Package tarball
        run: tar czf radmin-vpn-linux-${{ github.ref_name }}.tar.gz -C build .

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            radmin-vpn-linux-${{ github.ref_name }}.tar.gz
            RadminVPN-Linux-x86_64.AppImage
          generate_release_notes: true
