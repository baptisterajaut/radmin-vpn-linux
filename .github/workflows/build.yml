name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned build image
        run: docker build -f Dockerfile.build -t rvpn-build .

      - name: Build binaries
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src rvpn-build make

      - name: Build AppImage
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GITHUB_TOKEN \
            -v "$PWD":/src -w /src rvpn-build ./packaging/build-appimage.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-binaries
          path: |
            build/rvpnnetmp.sys
            build/adapter_hook.dll
            build/rvpn_launcher.exe
            build/netsh.exe
            build/netsh64.exe
            build/drvinst.exe
            build/tap_bridge
            build/rvpn_filter_ui
            build/rvpn_dnsfix.so
            build/rvpn_reuseport.so

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: radmin-vpn-linux-appimage
          path: packaging/dist/RadminVPN-Linux-x86_64.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-linux-binaries
          path: build/

      - uses: actions/download-artifact@v4
        with:
          name: radmin-vpn-linux-appimage
          path: .

      - name: Package tarball
        run: tar czf radmin-vpn-linux-${{ github.ref_name }}.tar.gz -C build .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            radmin-vpn-linux-${{ github.ref_name }}.tar.gz
            RadminVPN-Linux-x86_64.AppImage
          generate_release_notes: true
