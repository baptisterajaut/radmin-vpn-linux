name: Nix Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Check repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

    - name: Run Nix Build
      run: nix build
    - run: test -x result/bin/radmin-vpn-linux
    - run: test -f result/share/radmin-vpn-linux/build/rvpnnetmp.sys
