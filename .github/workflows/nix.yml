name: Nix Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Check repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

    - name: Run Nix Build
      run: nix build
    - run: test -x result/bin/radmin-vpn-linux
    - run: test -f result/share/radmin-vpn-linux/build/rvpnnetmp.sys
